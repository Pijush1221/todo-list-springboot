<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{style.css}">

    <style>
        .text-strikethrough{
            text-decoration: line-through;
            color: grey;
        }
    </style>
</head>
<body>
<div class="container">

    <div class="card">
        <h3>Create task</h3>
        <form action="/" method="post">
            <input class="form-control"
                   type="text"
                   name="title"
                   placeholder="Add a new task..."
                   required>

            <textarea class="form-control"
                      name="description"
                      rows="2"
                      placeholder="Add description (optional)"></textarea>

            <button type="submit" class="btn-primary">Add</button>
        </form>
    </div>

    <p class="mt-5 text-start">My tasks</p>

    <!-- Task List -->
    <div class="tasks-container">
        <th:block th:each="task : ${tasks}">
            <div class="task-card">
                <!-- Left side -->
                <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
                    <input type="checkbox"
                           class="task-checkbox"
                           th:checked="${task.completed}">
                    <div style="flex: 1;">
                        <p th:classappend="${task.completed} ? 'text-strikethrough'"
                           th:text="${task.title}"
                           style="margin: 0; font-size: 15px; color: #0C447C; font-weight: 500;"></p>
                        <p th:if="${task.description}"
                           th:text="${task.description}"
                           style="margin: 4px 0 0 0; font-size: 13px; color: #378ADD;"></p>
                    </div>
                </div>

                <div style="display: flex; align-items: center; gap: 6px;">
                    <button type="button"
                            class="icon-btn icon-btn-info"
                            onclick="showTaskDetails(this)"
                            title="Details"
                            th:attr="data-title=${task.title},
                                    data-description=${task.description},
                                    data-completed=${task.completed},
                                    data-created=${task.createdAt}">
                        ℹ️
                    </button>

                    <a th:href="@{/{id}/toggle(id=${task.id})}"
                       class="icon-btn icon-btn-toggle"
                       title="Toggle">✓</a>

                    <!-- Delete Button -->
                    <a th:href="@{/{id}/delete(id=${task.id})}"
                       class="icon-btn icon-btn-delete"
                       title="Delete"
                       onclick="return confirm('Are you sure?')">🗑️</a>
                </div>
            </div>
        </th:block>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(tasks)}"
         style="background: rgba(255,255,255,0.98); border-radius: 10px; padding: 24px; text-align: center;">
        <p style="margin: 0; color: #378ADD; font-size: 15px;">No tasks yet. Add your first task!</p>
    </div>
</div>

<div class="modal fade" id="taskDetailsModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Task details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <strong>Title:</strong>
                    <p id="modalTitle"></p>
                </div>
                <div class="mb-3">
                    <strong>Status:</strong>
                    <span id="modalStatus" class="badge"></span>
                </div>
                <div class="mb-3" id="modalDescriptionDiv">
                    <strong>Description:</strong>
                    <p id="modalDescription"></p>
                </div>
                <div class="mb-3" id="modalCreatedDiv">
                    <strong>Created at:</strong>
                    <p id="modalCreated"></p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function showTaskDetails(button) {
        const title = button.getAttribute('data-title');
        const description = button.getAttribute('data-description');
        const completed = button.getAttribute('data-completed') === 'true';
        const created = button.getAttribute('data-created');

        document.getElementById('modalTitle').textContent = title;

        const statusBadge = document.getElementById('modalStatus');
        if (completed) {
            statusBadge.className = 'badge bg-success';
            statusBadge.textContent = '✓ Completed';
        } else {
            statusBadge.className = 'badge bg-warning text-dark';
            statusBadge.textContent = '⏳ Pending';
        }

        const descDiv = document.getElementById('modalDescriptionDiv');
        if (description && description !== 'null' && description !== '') {
            document.getElementById('modalDescription').textContent = description;
            descDiv.style.display = 'block';
        } else {
            descDiv.style.display = 'none';
        }

        const createdDiv = document.getElementById('modalCreatedDiv');
        if (created && created !== 'null') {
            document.getElementById('modalCreated').textContent = created;
            createdDiv.style.display = 'block';
        } else {
            createdDiv.style.display = 'none';
        }

        const modal = new bootstrap.Modal(document.getElementById('taskDetailsModal'));
        modal.show();
    }
</script>
</body>
</html>
